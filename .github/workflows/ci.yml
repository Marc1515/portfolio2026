name: Validate portfolio

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run deterministic recruiter evaluations
        run: pnpm run test:chat-evals

      - name: Run lint
        run: pnpm lint

      - name: Run TypeScript checks
        run: pnpm exec tsc --noEmit

      - name: Build without provider secrets
        run: pnpm build

      - name: Check formatting
        run: pnpm exec prettier --check .
